[package]
name = "omniview"
version = "0.1.0"
edition = "2024"
description = "Cross-platform process / port / file occupancy inspector (Windows first)"
license = "MIT"
authors = ["Omniview"]

[dependencies]
anyhow = "1.0"
flume = "0.12"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.34", default-features = false, features = ["system"] }
thiserror = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"
incremental = false
split-debuginfo = "off"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
